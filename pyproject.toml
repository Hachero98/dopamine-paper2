# Tool configuration only. The code runs from the repository root without installation:
# `config.py` and the `src` package are imported directly (see README.md).

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 120
extend-exclude = ["notebooks"]
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E731", "E741"]   # small lambdas and the symbols of the model (l, I, O) are deliberate

[tool.ruff.lint.per-file-ignores]
"experiments/*.py" = ["E402"]   # `_common` must be imported first: it sets the import path
